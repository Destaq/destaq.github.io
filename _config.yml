# simonilincev.com
#
# The home page is /index.html, a hand-written static page (no front matter, so Jekyll copies it as is).
# Jekyll only builds the blog: posts in _posts, the pages in _pages, the feed and the sitemap.
# Layouts and includes are this repository's own; there is no theme.

title: Simon Ilincev
email: simon@simonilincev.com
description: Personal and portfolio website for Simon Ilincev.
url: "https://simonilincev.com"
baseurl: ""
github_username: Destaq
repository: "Destaq/destaq.github.io"
locale: "en-US"

theme: null # GitHub Pages would otherwise fall back to its default theme
markdown: kramdown
permalink: /:categories/:title/ # every post URL depends on this; do not change it

author:
    name: "Simon Ilincev"

disqus_shortname: "simonilincev"
analytics_id: "G-0M42PJ7MRK"

include:
    - _pages

exclude:
    - prototypes
    - .claude
    - .astro
    - dist
    - src
    - public
    - node_modules
    - test-results
    - vendor
    - Gemfile
    - Gemfile.lock
    - BLOG_IDEAS.md

plugins:
    - jekyll-sitemap
    - jekyll-feed
    - jemoji

defaults:
    - scope:
          path: ""
          type: posts
      values:
          layout: single
          comments: true
    - scope:
          path: "_pages"
          type: pages
      values:
          layout: single
    - scope:
          path: "misc" # fragments embedded elsewhere, not pages
      values:
          sitemap: false
